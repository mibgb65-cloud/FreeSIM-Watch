<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FreeSIM Watch · Cloudflare eSIM availability operations console" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('freesim-watch-theme');
          const mode = ['system', 'light', 'dark'].includes(saved) ? saved : 'system';
          const resolved = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeMode = mode;
          document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#0d0d0f' : '#ffffff';
        } catch {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>FreeSIM Watch</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
